[project]
name = "interview-ai-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. are meant to be called in argument
# defaults - that's the framework's own dependency-injection pattern, not
# the mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=98"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.mutmut]
source_paths = ["app/"]
pytest_add_cli_args = ["--no-cov"]
